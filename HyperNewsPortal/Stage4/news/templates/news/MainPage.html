<!DOCTYPE html>
<html>
<head>
    <title>Hyper news Main Page</title>
</head>
<body>
    <h2>Hyper news</h2>

    {% for date, articles in news.items %}
        <h4>{{ date }}</h4>
        <ul>
            {% for article in articles %}
                <li>
                    <a href="/news/{{ article.link }}/">
                        {{ article.title }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    {% endfor %}

    <a href="/news/create/">Create news</a>
</body>
</html>
